name: Tottus · actualizar precios

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *" # todos los días, 6:17 a. m. hora de Perú

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extraer precios de Tottus
        run: node scraper/tottus.mjs
      - name: Guardar cambios en el repositorio
        run: |
          git add js/data/prices-tottus.js data/tottus-catalogo.json
          if git diff --cached --quiet; then echo "Sin cambios de precios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar precios de Tottus ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
